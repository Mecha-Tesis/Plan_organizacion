<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0a09">
<title>MECHA · Equipo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0a09'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffb547' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="alternate" type="text/markdown" href="/mecha.md" title="Estado de MECHA en texto plano">
</head>
<body>
<header class="cabecera">
  <div class="marca">
    <span class="logo">MECHA</span>
    <span class="sub">la web del equipo</span>
  </div>
  <div class="cuenta">
    <strong id="dias">—</strong>
    <span>días para la muestra<br><small>semana del 20/12</small></span>
  </div>
</header>

<p id="aviso" class="aviso" role="status" hidden></p>

<main class="tablero">
  <section class="sala" aria-labelledby="t-sala">
    <div class="sala-cabeza">
      <h1 id="t-sala">La sala</h1>
      <p class="leido" id="leido">Leyendo Notion…</p>
    </div>
    <figure class="planta">
      <svg id="planta" viewBox="-24 -24 648 690" role="group" aria-label="Planta del aula, 6 por 6 metros. Tocá una estación."></svg>
    </figure>
    <ul class="leyenda" aria-label="Qué quiere decir cada color">
      <li><i class="punto lista"></i>Lista</li>
      <li><i class="punto falta"></i>Falta</li>
      <li><i class="punto bloqueada"></i>Algo bloqueado</li>
      <li><i class="punto nada"></i>Sin datos</li>
    </ul>
    <ul class="estaciones" id="lista" aria-label="Estaciones"></ul>
  </section>

  <aside class="general" aria-labelledby="t-general">
    <h2 id="t-general">General</h2>
    <p class="general-que" id="general-que"></p>
    <div id="general-cuerpo"></div>
  </aside>
</main>

<footer class="pie">
  <p><strong>Para tu IA:</strong> pasale este link y preguntale lo que quieras.</p>
  <div class="link-ia">
    <code id="link-ia">/mecha.md</code>
    <button type="button" id="copiar" class="boton chico">Copiar</button>
  </div>
</footer>

<dialog id="ficha" class="ficha" aria-labelledby="ficha-titulo">
  <form method="dialog" class="ficha-cerrar"><button class="cerrar" aria-label="Cerrar">×</button></form>
  <div id="ficha-cuerpo"></div>
</dialog>

<div id="tostada" class="tostada" popover="manual" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
